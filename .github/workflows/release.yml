name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # item/release-gate (issue #32): release.yml fired on workflow_dispatch and
  # on a tag push with NO `needs:` on any test job, so a dispatch against a
  # red main built and pushed `latest` to ghcr. This job is the first half of
  # the fix: refuse to even start verifying/building a commit that was never
  # merged to main. It has to run before `verify` (below), not just before
  # `image`, so a stray commit fails in seconds rather than after the whole
  # test suite has run against it.
  #
  # `fetch-depth: 0` rather than a shallow checkout plus a later fetch, and
  # the distinction matters more than it looks. actions/checkout defaults to
  # depth 1, which leaves a .git/shallow boundary; a subsequent
  # `git fetch origin main` inside a shallow repository is negotiated against
  # that boundary, and `git merge-base --is-ancestor` walking into a grafted
  # parent can answer "not an ancestor" for a commit that plainly is one.
  #
  # That false negative is the ONE failure mode worse than the defect this
  # job closes: it blocks a legitimate release, at the moment somebody is
  # trying to ship, with an error that accuses the commit rather than the
  # checkout. Fetching the full history costs seconds on a release path that
  # runs at most a few times a year, and removes the question entirely
  # instead of reasoning about git's shallow negotiation.
  ancestry-check:
    name: tagged commit is on main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch main so ancestry can be checked
        run: git fetch --no-tags origin main

      - name: Refuse to build/publish a commit that is not on main
        run: |
          set -e
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA (ref ${{ github.ref }}) is not an ancestor of origin/main -- refusing to verify, build or publish. Only tag or dispatch a commit that has already been merged to main."
            exit 1
          fi
          echo "$GITHUB_SHA is an ancestor of origin/main -- OK to proceed"

  # Runs the exact same suite a push to main runs, against the exact commit
  # this run is about to publish -- not main's last push run (decision/0016:
  # that lookup has cancelled-concurrency-run, wrong-ref and pooled-
  # conclusion pitfalls of its own, and would verify a tree that RESEMBLES
  # what gets published, not the one that does).
  #
  # No `secrets:` passed: tests.yml's `workflow_call` trigger declares none,
  # and every job in it only ever requests `contents: read` (checked, not
  # assumed -- see the comment on that trigger in tests.yml). `permissions`
  # here is the ceiling this call grants the reusable workflow's jobs; it
  # matches that need exactly rather than inheriting whatever this workflow
  # might otherwise have.
  verify:
    name: verify (tests.yml)
    needs: ancestry-check
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  image:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both the base image and the pinned MinIO image publish amd64 and
      # arm64, and COPY --from resolves per platform, so the MinIO binary
      # always matches the target architecture.
      #
      # Pinned by commit SHA per this repo's convention (see tests.yml and
      # decision/0082). Resolved with
      # `git ls-remote --tags <repo> | grep '\^{}'`: none of docker/
      # setup-qemu-action, docker/login-action or docker/metadata-action
      # printed a `^{}` peeled line for their v3/v4/v6 tags (checked, not
      # assumed), so each is a LIGHTWEIGHT tag and the single SHA
      # `ls-remote` prints for it already IS the commit -- unlike
      # softprops/action-gh-release@v3.0.3 below, which is annotated.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # WHERE `latest` COMES FROM, AND IT IS NOT THE LINE YOU THINK.
          #
          # item/tag-v1-0-0 clause (3) requires `docker pull
          # ghcr.io/turbophp/doccum` with NO tag to resolve to 1.0.0, and
          # README.md:10, docs/self-hosting/quick-start.md:11 and
          # backup-and-restore.md:67 all run the image untagged -- so every
          # quick start in this repository depends on `latest` existing.
          #
          # It comes from the `flavor` input's `latest` option, which this
          # workflow never sets and which therefore sits at its documented
          # default of `auto`. Under auto the action generates `latest` for
          # `type=semver,pattern=...` among others -- and the first tags entry
          # below is exactly that. Read from the action's source at the SHA
          # pinned above rather than from the README alone: src/meta.ts's
          # procSemver sets latest=true on the non-prerelease branch and leaves
          # it false on the prerelease branch, and generateTags appends
          # `:latest` whenever that flag is set. So a stable tag push has
          # ALWAYS published `latest`.
          #
          # THIS COMMENT USED TO SAY THE OPPOSITE, and the correction is kept
          # here rather than quietly overwritten because the wrong version was
          # load-bearing prose. It said clause (3) had been unsatisfiable --
          # that "a v1.0.0 tag would have published 1.0.0 and 1.0 and no
          # `latest` at all" -- citing decision/0103's conclusion that no tag
          # push moves `latest`. decision/0103 reached that by reading this
          # `tags:` list and stopping, without ever looking up `flavor`; it
          # quoted the README accurately about PRE-RELEASE tags and then
          # generalised to every tag. See decision/0122 and issue #348.
          #
          # SO THE LAST ENTRY IS REDUNDANT. It enables `latest` on exactly the
          # condition `auto` already enables it. It is KEPT deliberately: the
          # mechanism that actually does the work is an implicit default that
          # this file does not mention, which is precisely how the wrong
          # reading survived, and an explicit entry makes the intent legible to
          # the next person to edit this list. What it is NOT is the guarantee
          # -- deleting the `type=semver,pattern={{version}}` entry, not this
          # one, is what would break the pull-with-no-tag promise. Its one real
          # effect is a duplicate `latest` in steps.meta.outputs.tags, since
          # generateTags does not deduplicate; build-push-action does not mind.
          #
          # THE rc IS EXCLUDED TWICE OVER, which is the one property here worth
          # depending on. procSemver's prerelease branch leaves the auto flag
          # false, and `-` is SemVer's pre-release separator so the entry below
          # excludes v0.1.0-rc1 independently. Both halves of that entry are
          # needed: on a branch push github.ref_name is the branch, and branch
          # names here routinely contain '-'.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # steps.meta.outputs.labels already includes
          # org.opencontainers.image.version, derived from the same pushed
          # tag as steps.meta.outputs.version below. Passed here as --label
          # (confirmed empirically: a CLI/BuildKit --label wins over a
          # same-key Dockerfile LABEL), it is what actually lands in the
          # pushed image's config, overriding the Dockerfile's own
          # `LABEL org.opencontainers.image.version="$DOCCUM_VERSION"`. The
          # two never disagree in practice, because build-args below feeds
          # the Dockerfile's ARG the identical value metadata-action derived
          # the label from -- but on a release build it is metadata-action's
          # label, not the Dockerfile's, that wins. The Dockerfile's LABEL
          # exists for the case metadata-action is absent entirely: a plain
          # local `docker build`, or this repo's own tests.yml image job.
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DOCCUM_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # item/measure-image-size (issue #30), decision/0087. This job's own
      # build-push-action run above uses push: true with no `load:`, so the
      # image it just built was never loaded into this runner's local
      # docker -- only pushed. `docker image inspect` and `docker save`
      # (what image-size.sh needs) both require a local image, so one of
      # the tags actually pushed (steps.meta.outputs.tags, the exact list
      # handed to build-push-action's `tags:` above -- not a
      # semver-specific output, so this also works on a workflow_dispatch
      # run where only the `latest` raw tag applies) is pulled back down.
      # `docker pull` with no `--platform` resolves to the runner's own
      # platform (linux/amd64, same as the amd64 leg tests.yml's `image`
      # job already measured and gated for this exact commit as part of
      # the `verify` job above), not the multi-platform manifest list that
      # tag actually names.
      #
      # This is the actual place in this workflow that sees a built,
      # inspectable image -- the `image` job is the only one that builds
      # anything, and `release` (below) only ever touches CHANGELOG.md.
      - name: Pull the pushed image back down to measure it
        run: |
          set -euo pipefail
          tag="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)"
          echo "PULLED_TAG=${tag}" >> "$GITHUB_ENV"
          docker pull "$tag"

      - name: Print the image size for the release record
        run: .github/scripts/image-size.sh --print-only "$PULLED_TAG"

  # item/release-v0-1-0 (issue #32), proof (1): "ARM64, ACTUALLY BOOTED".
  # release.yml's `image` job above publishes linux/amd64,linux/arm64, but
  # tests.yml's own `image` job only ever builds and boots amd64 -- no arm64
  # binary of this project has ever been executed. This pulls the image
  # `image` just PUSHED (not a local build) natively on each architecture:
  # amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm (a free GitHub-hosted
  # runner for public repositories). No docker/setup-qemu-action anywhere in
  # this job, deliberately: a failure under emulation cannot be told apart
  # from an emulation bug, so it would read in neither direction. Each
  # matrix leg's runner is already that architecture, so `docker pull
  # --platform` and `docker run` execute the real binary, not a translated
  # one.
  #
  # needs: image, guarded to the tag-push trigger the same way `release`
  # below is: this workflow also fires on workflow_dispatch, where
  # github.ref is a branch, not a tag, and there is no version to resolve
  # into an image reference.
  #
  # Follows tests.yml's `image` job's own "Smoke test the image" idiom
  # (docker run -d, poll for the installer screen, confirm still running)
  # rather than inventing a new one -- the only difference is the image
  # comes from `docker pull`, not a local `docker build`.
  boot-published-image:
    name: "boot published image (${{ matrix.arch }})"
    needs: image
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: read
    steps:
      # Pulling a public ghcr.io package generally works unauthenticated,
      # but this repo's package visibility is not this job's business to
      # assume -- login the same way the `image` job above does before
      # pushing, so this works whether or not the package is public.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This job is separate from `image`, so steps.meta.outputs.version
      # from that job is not in scope here -- resolved independently, the
      # same way docker/metadata-action's `type=semver,pattern={{version}}`
      # derives it: the pushed tag minus a leading "v".
      - name: Resolve the tag this run published
        run: |
          set -euo pipefail
          echo "IMAGE_REF=ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Pull the published image for this architecture, no QEMU
        run: docker pull --platform ${{ matrix.platform }} "$IMAGE_REF"

      - name: Boot the pulled image and assert it serves the installer
        run: |
          set -e
          docker run -d --name doccum-boot-${{ matrix.arch }} -v doccum-boot-${{ matrix.arch }}:/data -p 8080:8080 "$IMAGE_REF"

          ok=false
          for i in $(seq 1 30); do
            if ! docker inspect -f '{{.State.Running}}' doccum-boot-${{ matrix.arch }} 2>/dev/null | grep -q true; then
              echo "::error::[${{ matrix.arch }}] published image ($IMAGE_REF) exited before it ever answered"
              break
            fi
            if body=$(curl -sS -L --max-time 5 http://127.0.0.1:8080/ 2>/dev/null); then
              if echo "$body" | grep -q 'Set up doccum'; then
                ok=true
                break
              fi
            fi
            sleep 2
          done

          if [ "$ok" != true ]; then
            echo "::error::[${{ matrix.arch }}] doccum never served the first-run setup screen from the PUBLISHED image $IMAGE_REF -- this architecture has effectively never been booted"
            docker logs doccum-boot-${{ matrix.arch }} || true
            exit 1
          fi

          echo "[${{ matrix.arch }}] published image is up and serving the installer screen"

          if ! docker inspect -f '{{.State.Running}}' doccum-boot-${{ matrix.arch }} | grep -q true; then
            echo "::error::[${{ matrix.arch }}] published image crashed after answering once"
            docker logs doccum-boot-${{ matrix.arch }} || true
            exit 1
          fi

      # issue #340. Everything above this line proves the published image
      # answers with one string; everything below drives it the way
      # container-smoke.mjs drives tests.yml's LOCALLY BUILT image --
      # installer, upload, extraction, search -- so upload/search/trash/
      # purge are exercised on the artifact a self-hoster actually pulls, at
      # least once, rather than only on an image this repository built
      # itself and never published anywhere. This is the ONLY place in the
      # project that happens; tests.yml's own `image` job runs the same
      # script against `docker build`'s output, which proves the Dockerfile
      # but not the registry push, the multi-arch manifest, or anything
      # `docker/build-push-action` could get wrong between building and
      # publishing.
      #
      # amd64 ONLY (`if:` on every step below), per issue #340: "the amd64
      # leg at minimum". arm64 is a GitHub-hosted runner with no local
      # Playwright/Chromium apt mirror guarantees this project has verified,
      # and extending the full smoke there is out of scope for this pass --
      # the single-string boot check above still runs on both legs
      # unchanged.
      #
      # The seven SMOKE_* fixtures below are copied from tests.yml's
      # "Generate smoke test fixtures" step (same RUN_ID/DIGITS derivation),
      # not extracted into something shared -- a reusable workflow input or
      # a composite action would need its own review and is a bigger change
      # than this issue asks for. Copy-paste normally rots the moment one
      # side changes and the other doesn't; what makes THIS copy safe is not
      # a comment asking the next editor to keep them in sync, but
      # `.github/scripts/assert-published-smoke.py` (wired into tests.yml as
      # a PR check), which parses container-smoke.mjs's own `env(...)` calls
      # and fails the build the moment a required variable exists there
      # without existing here. Only the SEVEN variables container-smoke.mjs
      # requires with no default are reproduced -- the rest (trash/version/
      # stale-user fixtures) are for `seed-stale`/`verify`, which this job
      # never runs.
      # THE REPOSITORY IS NOT ON THIS RUNNER UNTIL HERE, and nothing above
      # needed it: every step before this one works from the registry and
      # the git ref alone, which is why this job had no checkout at all
      # until the smoke arrived. `node .github/scripts/container-smoke.mjs`
      # and `npm install --prefix .github/scripts` both read files out of
      # the tree, so without this they fail on a path that does not exist --
      # at tag time, in the one job that cannot be rehearsed. Every other
      # job in this workflow that runs a repo script (`image`, `release`,
      # `verify-release-notes`) checks out for the same reason;
      # assert-published-smoke.py now refuses if this job stops doing so.
      #
      # amd64-gated like the steps below it: the arm64 leg runs only the
      # single-string boot check above and needs no tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.arch == 'amd64'
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.arch == 'amd64'
        with:
          node-version: '22'

      - name: Generate smoke test fixtures
        if: matrix.arch == 'amd64'
        run: |
          RUN_ID="${{ github.run_id }}-${{ github.run_attempt }}"
          DIGITS="$(echo "$RUN_ID" | tr -cd '0-9')"
          {
            echo "SMOKE_INSTANCE_NAME=doccum release boot smoke"
            echo "SMOKE_ADMIN_NAME=Smoke Admin"
            # Username charset is constrained (app/Concerns/ProfileValidationRules.php:
            # ^[a-z0-9._-]+$) because it names the admin's home directory.
            echo "SMOKE_ADMIN_USERNAME=smokeadmin${DIGITS}"
            echo "SMOKE_ADMIN_EMAIL=smoke+${RUN_ID}@example.test"
            # config/app.php defaults APP_ENV to "production" when unset, and
            # the image's own `docker run` sets no APP_ENV -- so this is the
            # real production rule (app/Providers/AppServiceProvider.php):
            # min 12, mixed case, letters, numbers, symbols, uncompromised().
            echo "SMOKE_ADMIN_PASSWORD=Doccum-Smoke-${RUN_ID}!Aa9"
            echo "SMOKE_FILE_NAME=smoke-${RUN_ID}.txt"
            echo "SMOKE_FILE_MARKER=smokeword${DIGITS}"
          } >> "$GITHUB_ENV"

      - name: Install Playwright (smoke-test driver only, not a project dependency)
        if: matrix.arch == 'amd64'
        timeout-minutes: 5
        run: |
          npm install --no-save --prefix .github/scripts playwright@1.49.1
          .github/scripts/node_modules/.bin/playwright install --with-deps chromium

      - name: Complete the installer, upload a file, wait for extraction, search
        if: matrix.arch == 'amd64'
        timeout-minutes: 8
        env:
          BASE_URL: http://127.0.0.1:8080
          CONTAINER_NAME: doccum-boot-${{ matrix.arch }}
        run: node .github/scripts/container-smoke.mjs setup

      - name: Container logs
        if: failure()
        run: docker logs doccum-boot-${{ matrix.arch }} || true

  # item/release-v0-1-0 (issue #32), proof (2): "THE TAG REACHES THE IMAGE".
  # ARG DOCCUM_VERSION feeds both the org.opencontainers.image.version label
  # and config('doccum.version'), so those two agreeing (container-smoke.mjs's
  # version-pill check) proves nothing about whether the build arg itself was
  # right -- decision/0080: two readers of one upstream value are one source
  # wearing two hats. The only independent witness is the git ref this run
  # was triggered from, which is what this job compares against.
  #
  # needs: image and guarded the same way boot-published-image is above, for
  # the same reason: no image job, this doesn't run, and no tag, there is
  # nothing to compare against.
  verify-version-label:
    name: published image label matches the tag
    needs: image
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolved independently of the `image` job's steps.meta output, same
      # as boot-published-image above -- this is a separate job.
      - name: Resolve the tag this run published
        run: |
          set -euo pipefail
          echo "EXPECTED_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "IMAGE_REF=ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Pull the published image
        run: docker pull "$IMAGE_REF"

      - name: Assert the image's version label equals the tag that triggered this run
        run: |
          set -euo pipefail
          LABEL_VERSION="$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$IMAGE_REF")"

          if [ "$LABEL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::published image's org.opencontainers.image.version label ('${LABEL_VERSION}') does not equal the tag that triggered this run ('${EXPECTED_VERSION}', from ref ${{ github.ref }}) -- ARG DOCCUM_VERSION disagrees with the git ref this image was supposedly built from"
            exit 1
          fi

          echo "published image's version label ('${LABEL_VERSION}') matches the triggering tag ('${EXPECTED_VERSION}')"

  # item/tag-v1-0-0 clause (3): "`docker pull ghcr.io/turbophp/doccum` with
  # no tag resolves to 1.0.0". The README quick start pulls the bare ref and
  # LOOP.md's stopping condition says ghcr carries the image; nothing
  # asserted that the two agree, and the clause said so without building it.
  #
  # The check is a DIGEST comparison, deliberately, not a label or version
  # comparison. `latest` and `{{version}}` are two tags this same workflow
  # pushes from one build, so any value read out of both images is one
  # source wearing two hats -- decision/0080, the mistake verify-version-
  # label above exists to avoid. Two tags resolving to the same manifest
  # digest is a fact about the registry, not about the image's contents, and
  # it is the only thing that actually answers "does a bare pull get 1.0.0".
  #
  # It performs the user's action rather than modelling it: `docker pull`
  # with no tag is exactly what the README tells a self-hoster to run, and
  # `docker pull` prints the manifest digest it resolved, so each ref is
  # measured by its own pull rather than by inspecting a shared local image
  # (which would carry BOTH RepoDigests once the second pull is a cache hit,
  # and so could never disagree).
  #
  # Guarded more narrowly than its siblings: `latest` is published only on a
  # non-pre-release tag, so on an rc there is no `latest` for this run to
  # check and a bare pull would resolve to whatever was published before it
  # -- a stale image this run did not build. Skipped rather than failing,
  # which is the honest answer.
  #
  # This used to attribute that exclusion to "the type=raw rule in the image
  # job above". It is really docker/metadata-action's `flavor: latest=auto`
  # default acting on `type=semver,pattern={{version}}`, whose prerelease
  # branch leaves the latest flag false; the raw rule excludes an rc too, but
  # it is redundant. See that job's comment, decision/0122 and issue #348.
  verify-latest-resolves-to-the-tag:
    name: a bare docker pull resolves to this tag
    needs: image
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the two refs this run published
        run: |
          set -euo pipefail
          echo "BARE_REF=ghcr.io/${{ github.repository }}" >> "$GITHUB_ENV"
          echo "VERSION_REF=ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Assert the bare ref and this tag resolve to the same manifest
        run: |
          set -euo pipefail

          # `docker pull` prints "Digest: sha256:..." for the manifest it
          # resolved. Captured per pull, so the two values have independent
          # origins even when the second pull is entirely a cache hit.
          BARE_DIGEST="$(docker pull "$BARE_REF" | awk '/^Digest: /{ print $2 }')"
          VERSION_DIGEST="$(docker pull "$VERSION_REF" | awk '/^Digest: /{ print $2 }')"

          if [ -z "$BARE_DIGEST" ] || [ -z "$VERSION_DIGEST" ]; then
            echo "::error::could not read a manifest digest from docker pull -- bare='${BARE_DIGEST}', ${GITHUB_REF_NAME#v}='${VERSION_DIGEST}'. The pull output format changed, so this check proved nothing; fix the check before trusting a green result."
            exit 1
          fi

          if [ "$BARE_DIGEST" != "$VERSION_DIGEST" ]; then
            echo "::error::a bare 'docker pull ${BARE_REF}' resolves to ${BARE_DIGEST}, but '${VERSION_REF}' is ${VERSION_DIGEST} -- the README quick start would hand a self-hoster a different image from the one this tag published"
            exit 1
          fi

          echo "bare pull of ${BARE_REF} and ${VERSION_REF} both resolve to ${BARE_DIGEST}"

  # item/changelog-release-notes (issue #31): a pushed tag is also supposed
  # to produce a GitHub Release, body taken verbatim from that version's
  # CHANGELOG.md section. Split from the `image` job so a release is never
  # created ahead of -- or on top of a failed -- image push, but its own
  # failure never blocks the image from having gone out.
  #
  # `needs` ALSO CARRIES boot-published-image, issue #303, and that is the
  # same argument one step further. A GitHub Release is the user-visible
  # announcement: it is what a self-hoster reads and trusts, where a ghcr
  # package version is something they have to go looking for. Announcing a
  # version whose arm64 image has not been shown to start is worse than
  # merely having pushed it, and with `needs: image` alone that is exactly
  # what happened -- `release` and `boot-published-image` both hung off
  # `image` and ran in PARALLEL, so a red arm64 leg arrived after the
  # Release was already public.
  #
  # This is not a new position. item/release-v0-1-0's own clause says to
  # DROP linux/arm64 from this workflow "rather than shipping a manifest
  # nobody has booted", and item/tag-v1-0-0 requires both the arm64 boot and
  # the Release. A project holding that cannot also be neutral about
  # announcing before the boot check finishes; the split was inconsistent
  # with the items, and reconciling code with an item's doneWhen is ordinary
  # work rather than a question for the owner (decision/0110, decision/0117).
  #
  # THE COST, stated because it is real: this serialises the one workflow
  # that cannot be re-run against the same tag, so a tag's total time grows
  # by the boot matrix. Accepted -- a slower announcement is recoverable, a
  # wrong one is not.
  #
  # Both jobs carry the same `if: startsWith(github.ref, 'refs/tags/')`, so
  # on a workflow_dispatch boot-published-image skips, `release` skips on its
  # own guard, and behaviour there is unchanged.
  #
  # NOTHING HERE HAS EVER EXECUTED, and the gate cannot be proven by running
  # it: release.yml fires on a tag or a dispatch, and a dispatch on main
  # would publish ghcr `latest` with DOCCUM_VERSION=latest -- the unversioned
  # publish decision/0090 warned against. So the guard is asserted
  # STATICALLY instead, by the `release waits for the published image to
  # boot` job in tests.yml, which parses this file and fails if
  # boot-published-image leaves this list. A declared dependency nobody can
  # exercise is worth more with an assertion that it is still declared than
  # with a comment saying it should be.
  #
  # Guarded to the tag-push trigger only: this workflow also fires on
  # workflow_dispatch, where github.ref is whatever branch was dispatched
  # from, not a tag -- there is no version to read a changelog section for,
  # and the job is skipped outright rather than failing confusingly deep
  # inside changelog-section.sh. release-skipped-notice below exists so a
  # workflow_dispatch run still says why, instead of a same-named job simply
  # not appearing.
  release:
    runs-on: ubuntu-latest
    needs: [image, boot-published-image]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # github.ref_name for a tag push is the tag with the refs/tags/
      # prefix already stripped by GitHub (e.g. "v0.1.0"), matching the
      # `type=semver,pattern={{version}}` tag the `image` job above just
      # pushed the container under. changelog-section.sh strips a leading
      # "v" itself, so it is passed through unchanged here.
      - name: Extract this version's changelog section
        run: |
          set -e
          .github/scripts/changelog-section.sh "${{ github.ref_name }}" CHANGELOG.md > /tmp/release-notes.md
          echo "Release notes for ${{ github.ref_name }}:"
          cat /tmp/release-notes.md

      # Pinned by COMMIT SHA per this repo's convention (see tests.yml).
      #
      # efb35369 is the commit; e598afbe -- which `git ls-remote --tags`
      # prints beside refs/tags/v3.0.3 -- is NOT. This repo's other tags
      # happen to be lightweight, where the printed SHA IS the commit
      # (actions/checkout v7.0.1 = 3d3c42e5, no peeled line), but v3.0.3
      # here is an ANNOTATED tag, so ls-remote prints the tag object first
      # and the commit only on the `^{}` line:
      #
      #   e598afbe...  refs/tags/v3.0.3
      #   efb35369...  refs/tags/v3.0.3^{}      <- the commit
      #
      # Taking the first line gives a tag-object SHA, which is not what
      # `uses: owner/repo@<sha>` wants. Resolve with
      # `git ls-remote --tags <repo> | grep '\^{}'` before pinning anything
      # here, and do not assume the two lines are interchangeable.
      # item/release-v0-1-0 (issue #32): a tag carrying a pre-release suffix
      # publishes a PRE-RELEASE, so the throwaway rc that item needs does not
      # present itself on the releases page as this project's first release.
      # `-` is the SemVer pre-release separator; build metadata ("+build.5")
      # is deliberately not treated as one, because it names the same release.
      #
      # What this does NOT have to guard, checked rather than assumed against
      # docker/metadata-action's README at the SHA pinned above: an rc cannot
      # move a stable container tag here. `latest` is gated on
      # {{is_default_branch}}, which is false for any tag push, and for a
      # pre-release the action degrades `{{major}}.{{minor}}` to `{{version}}`
      # ("Pre-release (rc, beta, alpha) will only extend {{version}}"), so
      # v0.1.0-rc1 pushes 0.1.0-rc1 and nothing else. The suffix is still
      # mandatory, but for the reason below rather than the container tags:
      # a bare v0.1.0 would BE the release, notes and all, and this one is
      # meant to be deleted.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}

  release-skipped-notice:
    runs-on: ubuntu-latest
    needs: image
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - name: Explain why no Release was created
        run: |
          echo "::notice::This run was not a tag push (ref: ${{ github.ref }}), so no GitHub Release was created. Push a v* tag to publish one."

  # item/release-v0-1-0 (issue #32), proof (3): "THE RELEASE CARRIES THE
  # CHANGELOG". item/changelog-release-notes wired `release` (above) to
  # create a GitHub Release from changelog-section.sh's output, and nothing
  # has ever actually created one. This asserts the Release that `release`
  # just created has a body identical to what changelog-section.sh prints
  # for this tag -- the same extractor, including its pre-release fallback
  # (a "-rc1" tag's Release body is the release-core section, e.g. [0.1.0]
  # for a v0.1.0-rc1 tag, never a fabricated "[0.1.0-rc1]" section).
  #
  # needs: release, not image: this has nothing to check until `release` has
  # actually run, and if `release` failed (or was skipped by
  # release-skipped-notice on a workflow_dispatch run) there is no Release
  # to fetch, so this job is skipped along with it via the ordinary `needs`
  # success rule. Guarded to the tag-push trigger anyway, matching `release`
  # exactly, so a workflow_dispatch run never even attempts this.
  #
  # `contents: read` is enough for GET /repos/{owner}/{repo}/releases/tags/{tag}
  # -- GitHub gates the Releases REST API on the `contents` permission, not a
  # separate one -- so this reuses `${{ github.token }}` rather than any
  # broader credential.
  verify-release-notes:
    name: GitHub Release body matches the changelog section
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The exact same command the `release` job's own "Extract this
      # version's changelog section" step ran, against the same checked-out
      # CHANGELOG.md -- this is the expected value, not a re-derivation of it.
      - name: Extract this version's changelog section
        run: |
          set -e
          .github/scripts/changelog-section.sh "${{ github.ref_name }}" CHANGELOG.md > /tmp/expected-release-notes.md

      - name: Fetch the GitHub Release body for this tag
        env:
          RELEASE_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -sS -f \
            -H "Authorization: Bearer ${RELEASE_API_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" \
            | jq -r '.body // ""' > /tmp/actual-release-body.md

      - name: Assert the Release body is exactly this version's changelog section
        run: |
          set -e

          # Normalise CRLF before comparing, and do it on BOTH sides rather
          # than only the one suspected of carrying it.
          #
          # changelog-section.sh emits LF. GitHub's Releases API returns a
          # release `body` with CRLF line endings for notes that were posted
          # with LF, so a byte comparison of the two would have failed on the
          # FIRST rc for a reason that has nothing to do with the notes having
          # drifted -- burning the throwaway tag this whole job exists to make
          # count, and reporting "the notes have drifted" when they had not.
          #
          # Stripping CR rather than adding it keeps the assertion about the
          # TEXT. What this job is for is catching a Release whose body is not
          # this version's changelog section; line-ending transport is not
          # part of that claim, so it must not be able to fail it.
          expected="$(tr -d '\r' < /tmp/expected-release-notes.md)"
          actual="$(tr -d '\r' < /tmp/actual-release-body.md)"

          if [ "$expected" != "$actual" ]; then
            echo "::error::the GitHub Release for tag ${{ github.ref_name }} has a body that does not match '.github/scripts/changelog-section.sh ${{ github.ref_name }} CHANGELOG.md' -- release.yml's release job created a Release whose notes have drifted from the changelog"
            echo "--- expected (changelog-section.sh) ---"
            echo "$expected"
            echo "--- actual (GitHub Release body) ---"
            echo "$actual"
            exit 1
          fi

          echo "GitHub Release body for ${{ github.ref_name }} matches the changelog section exactly"
