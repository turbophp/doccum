name: tests

on:
  push:
    branches:
      - main
  pull_request:
  # item/release-gate (issue #32): release.yml calls this workflow as its
  # `verify` job, so a tag push or workflow_dispatch runs the exact same
  # suite a push to main does, rather than trusting whatever main's last
  # push run happened to say (decision/0016 -- that lookup has its own
  # pitfalls: cancelled concurrency runs, checks from other refs, pooled
  # conclusions). No `secrets:` block below: every job in this file only
  # ever asks for `contents: read` (grep the job-level `permissions:` --
  # there is no `secrets.` reference anywhere in this workflow), so the
  # calling job in release.yml grants that alone rather than
  # `secrets: inherit`.
  workflow_call:

permissions:
  contents: read

# A push that supersedes an in-flight run (force-push, quick follow-up commit)
# should not keep burning runner minutes on code nobody will look at.
#
# Called via workflow_call (release.yml's `verify` job), github.workflow and
# github.ref both resolve in the CALLER's context: github.workflow is
# "release" (not "tests"), and github.ref is whatever ref triggered
# release.yml (the pushed tag, or the ref workflow_dispatch ran from) --
# never "refs/heads/main" or a PR merge ref. So a called run's group is
# always "release-<that ref>", which cannot collide with this workflow's own
# "tests-refs/heads/main" or "tests-refs/pull/<n>/merge" groups, and two
# concurrent releases of the *same* ref (e.g. a repeated workflow_dispatch)
# still get sane cancel-in-progress behaviour. Confirmed against GitHub's
# documented context-inheritance rules for workflow_call; not something this
# environment can execute to observe directly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Kept in one place so bumping the default PHP version touches one line.
  # Tracks what the image ships (Dockerfile's base stage), so the jobs that
  # run on one version only -- lint, guards, the asset build -- run on the
  # version users actually get. It drifted to 8.4 the moment the base image
  # moved to 8.5.
  PRIMARY_PHP: '8.5'

jobs:
  lint:
    timeout-minutes: 10
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.PRIMARY_PHP }}
          tools: composer:v2
          coverage: none

      - name: Cache composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ env.PRIMARY_PHP }}-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # issue #377. `undefined/H1-header.png` was tracked at the repo root for
      # three days and shipped in every image layer -- .dockerignore does not
      # cover it and the Dockerfile is `COPY . .`. A path segment named
      # `undefined` is a tool interpolating a JavaScript variable that had no
      # value; nobody types one. So the CLASS refuses rather than that one
      # file, and it refuses at the pull request rather than three days and
      # one published image later.
      #
      # Anchored with `-x` on whole path SEGMENTS, not a substring: a real
      # file called `undefined.test.ts` or a directory `not-undefined/` is
      # somebody's deliberate name and this has no opinion about it.
      - name: No tracked path segment is a JavaScript accident
        run: |
          set -euo pipefail

          hits="$(git ls-files | awk -F/ '{
            for (i = 1; i <= NF; i++) {
              if ($i == "undefined" || $i == "null" || $i == "NaN" || $i == "[object Object]") {
                print; next
              }
            }
          }')"

          if [ -n "$hits" ]; then
            echo "::error::a tracked path has a segment named undefined/null/NaN/[object Object] -- that is a tool interpolating a value it did not have, not a name. Delete the file; do not add it to .dockerignore, which would leave it in the repository. See issue #377."
            echo "$hits"
            exit 1
          fi

          echo "no tracked path segment is undefined, null, NaN or [object Object] (checked $(git ls-files | wc -l) tracked paths)"

      - name: Pint (format check)
        run: composer lint:check

      # phpstan-baseline.neon enumerates the findings that predate this
      # work, so a new one fails the build however many old ones there are.
      # It replaced a count comparison, which could only notice that a total
      # had moved -- and duly hid two fresh findings in a brand-new file
      # behind four pre-existing ones that had been fixed in the same branch.
      #
      # Regenerate with .github/workflows/phpstan-baseline.yml, and only from
      # a branch whose own code is already clean: a baseline generated over a
      # dirty branch quietly blesses whatever was wrong with it.
      - name: PHPStan
        run: composer types:check

  # Built once and shared with every test leg below -- the compiled assets
  # depend on package-lock.json, not on the PHP version or database under
  # test, so building them six times would just be six copies of the same
  # `public/build` output.
  assets:
    timeout-minutes: 10
    name: build assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.PRIMARY_PHP }}
          tools: composer:v2
          coverage: none

      - name: Cache composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ env.PRIMARY_PHP }}-${{ hashFiles('composer.lock') }}

      # resources/css/app.css imports Flux's stylesheet straight out of
      # vendor/, so the PHP dependencies have to be on disk before Vite can
      # resolve anything. This is why the old single-job CI ran `composer
      # setup`, which did both in order.
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-build
          path: public/build
          retention-days: 1

  test:
    timeout-minutes: 20
    name: test (php ${{ matrix.php }}, ${{ matrix.database }})
    needs: assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 8.4 is what the image ships today. 8.5 is here because Dependabot
        # wants to bump the base image to it (#40), and merging that without
        # a leg would ship a PHP version nothing runs the suite on -- which
        # is exactly how composer.json came to advertise 8.3 support that its
        # own lock file made impossible. 8.3 is absent for that same reason,
        # the other way round: symfony/* 8.1.x needs >= 8.4.1, so
        # `composer install` cannot complete there at all.
        php: ['8.4', '8.5']
        database: [sqlite, pgsql, mysql]
        include:
          # sqlite is the product's own default (spec: embedded, no server),
          # and the only driver FTS5 keyword search runs on -- everything
          # else falls back to LIKE (Search\SearchIndex), so both code paths
          # genuinely need their own leg, not just a config knob.
          - database: sqlite
            db_connection: sqlite
            db_database: ':memory:'
          - database: pgsql
            db_connection: pgsql
            db_host: 127.0.0.1
            db_port: 5432
            db_database: doccum
            db_username: doccum
            db_password: doccum
          - database: mysql
            db_connection: mysql
            db_host: 127.0.0.1
            db_port: 3306
            db_database: doccum
            db_username: doccum
            db_password: doccum
    # Both services always start, even on the sqlite legs that never touch
    # them: GitHub Actions has no way to make a job's service containers
    # conditional on the matrix leg that will end up running, only on the
    # job as a whole. The alternative -- three separate jobs -- would dodge
    # the idle containers but split the "one test job, one matrix" shape the
    # task asks for, so the few wasted seconds of container start-up on
    # sqlite legs are accepted here instead.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: doccum
          POSTGRES_USER: doccum
          POSTGRES_PASSWORD: doccum
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U doccum"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: doccum
          MYSQL_USER: doccum
          MYSQL_PASSWORD: doccum
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    # Real environment variables, not phpunit.xml edits: RefreshDatabase
    # resolves config('database.default') lazily at rollback time, and
    # phpunit.xml's <env> entries do not use force="true", so a genuine OS
    # env var here wins over the file's sqlite default -- exactly the seam
    # CLAUDE.md calls out.
    env:
      DB_CONNECTION: ${{ matrix.db_connection }}
      DB_HOST: ${{ matrix.db_host }}
      DB_PORT: ${{ matrix.db_port }}
      DB_DATABASE: ${{ matrix.db_database }}
      DB_USERNAME: ${{ matrix.db_username }}
      DB_PASSWORD: ${{ matrix.db_password }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
          # Matches the Dockerfile's install-php-extensions list (pdo_sqlite
          # pdo_pgsql pdo_mysql intl gd zip bcmath exif) so CI exercises the
          # same driver set the shipped image does, both database directions
          # included.
          extensions: mbstring, pdo_sqlite, pdo_pgsql, pdo_mysql, sqlite3, intl, gd, zip, bcmath, exif, fileinfo

      - name: Cache composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      # Only APP_KEY is needed from here -- no `artisan migrate` call, because
      # tests/Pest.php applies RefreshDatabase suite-wide, and that migrates
      # (against the real DB_* env vars set above) itself, once per test.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-build
          path: public/build

      # No separate "wait for it" step is needed here: GitHub Actions already
      # blocks every step in this job until the service containers' own
      # --health-cmd checks pass, sqlite legs included (they just have no
      # service to wait on).
      - name: Run tests
        run: php artisan test

  # CLAUDE.md: "Mutation-check every security test. Delete the guard, confirm
  # the test fails, restore it. A guard whose test passes without it is worse
  # than none, because it looks protected." Three guards in this codebase have
  # already passed without the code they were guarding, so this is a job
  # rather than a habit.
  guards:
    timeout-minutes: 20
    name: guards
    needs: assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.PRIMARY_PHP }}
          tools: composer:v2
          coverage: none
          extensions: mbstring, pdo_sqlite, sqlite3, intl, gd, zip, bcmath, exif, fileinfo

      - name: Cache composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ env.PRIMARY_PHP }}-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-build
          path: public/build

      # SQLite only: a guard is application logic, and proving it is
      # load-bearing does not need proving again per database driver.
      - name: Check every guard is load-bearing
        run: php .github/scripts/mutation-check.php

      # The script restores the file it edited even when a test run dies, so
      # a dirty tree here means that failed -- worth knowing loudly.
      - name: Assert the working tree was restored
        if: always()
        run: git diff --exit-code

  # item/compose-secret / decision/0078: `docker compose config` resolves
  # variables and interpolation WITHOUT starting anything, so this proves the
  # `storage` profile actually refuses to run without MINIO_ROOT_PASSWORD
  # rather than quietly falling back to the known password that used to ship
  # in compose.yaml. No `needs:` on purpose -- this costs seconds and needs
  # nothing the other jobs build, so it runs immediately rather than waiting
  # behind `image`, which it has nothing to do with.
  compose-secret:
    timeout-minutes: 5
    name: compose requires MINIO_ROOT_PASSWORD
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Both directions matter, and a grep for the literal string "doccum-secret"
      # would pass the first one even with a `${MINIO_ROOT_PASSWORD:-doccum-secret}`
      # default in place, since a default never leaves the unset case failing --
      # it just quietly keeps the known password. Only actually asking compose
      # to resolve the variable, unset, catches that.
      - name: Unset MINIO_ROOT_PASSWORD must fail the storage profile, naming it
        run: |
          set +e
          output="$(env -u MINIO_ROOT_PASSWORD docker compose --profile storage config 2>&1)"
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "::error::expected 'docker compose --profile storage config' to exit non-zero with MINIO_ROOT_PASSWORD unset, but it exited 0 -- the storage profile is defaulting the secret instead of requiring it (use \${MINIO_ROOT_PASSWORD:?message}, not :-)"
            echo "$output"
            exit 1
          fi

          if ! printf '%s' "$output" | grep -q "MINIO_ROOT_PASSWORD"; then
            echo "::error::'docker compose --profile storage config' failed as expected with MINIO_ROOT_PASSWORD unset, but its output never named MINIO_ROOT_PASSWORD -- an operator would not know what to set"
            echo "$output"
            exit 1
          fi

          echo "unset MINIO_ROOT_PASSWORD correctly fails the storage profile and names it:"
          echo "$output"

      - name: Set MINIO_ROOT_PASSWORD must succeed with no doccum-secret left
        env:
          MINIO_ROOT_PASSWORD: ci-compose-secret-check
        run: |
          set +e
          output="$(docker compose --profile storage config 2>&1)"
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "::error::expected 'docker compose --profile storage config' to exit 0 with MINIO_ROOT_PASSWORD set, but it exited $status"
            echo "$output"
            exit 1
          fi

          if printf '%s' "$output" | grep -q "doccum-secret"; then
            echo "::error::'docker compose --profile storage config' rendered a doccum-secret occurrence with MINIO_ROOT_PASSWORD set -- expected none"
            echo "$output"
            exit 1
          fi

          echo "MINIO_ROOT_PASSWORD set resolves cleanly with no doccum-secret in the rendered config"

  # issue #303. release.yml's `release` job used to be `needs: image` while
  # `boot-published-image` was ALSO `needs: image`, so the GitHub Release --
  # the user-visible announcement -- was created in parallel with the job
  # proving the image starts. A red arm64 leg arrived after the Release was
  # already public.
  #
  # THIS JOB EXISTS BECAUSE THE GATE CANNOT BE PROVEN BY RUNNING IT.
  # release.yml fires only on a tag push or a workflow_dispatch. There is no
  # tag, and a dispatch on main would publish ghcr `latest` with
  # DOCCUM_VERSION=latest -- the unversioned publish decision/0090 warned
  # against -- so no run available to this project exercises the dependency.
  # A comment saying "release waits for the boot" would then be a claim
  # nothing checks, which is the shape decision/0113 is about: when a guard
  # cannot be exercised, assert it statically and REFUSE, rather than
  # describe it and hope.
  #
  # It parses the workflow rather than grepping it, so reordering the list,
  # reflowing it to one entry per line, or switching between the flow and
  # block YAML forms all still pass -- and removing the dependency fails
  # however it is spelled. A grep for a literal string would be defeated by
  # a line break.
  release-gate:
    timeout-minutes: 5
    name: release waits for the published image to boot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # PyYAML is present on ubuntu-latest today, and "today" is not a thing
      # this project accepts as a dependency -- a runner image change would
      # turn this check into an ImportError that reads like a real failure.
      # Installed explicitly, and pinned, so the parse this job depends on is
      # the one it was written against.
      - name: Install PyYAML
        run: python3 -m pip install --quiet 'PyYAML==6.0.2'

      - name: release.needs includes boot-published-image
        run: python3 .github/scripts/assert-release-gate.py

      # The assertion above can only fail on a real regression while it is
      # reading a file whose shape it understands -- a document that parsed
      # to nothing would make every lookup miss and report a rename rather
      # than the truth. The script proves the parse reached real content
      # before it asserts anything, and this step re-runs it with the proof
      # printed, so a reader sees WHAT was parsed rather than only a verdict.
      - name: Show what was parsed
        run: python3 .github/scripts/assert-release-gate.py --verbose

  # issue #340 (second box). release.yml's `boot-published-image` job pulls
  # the PUBLISHED image and, before this issue, asserted exactly one string
  # against it -- proving the container starts, and nothing about upload,
  # search, trash or purge on the artifact a self-hoster actually pulls.
  # That job now runs the full container-smoke.mjs suite too, but only on
  # the amd64 leg, only on a tag push, and it duplicates rather than shares
  # the seven SMOKE_* fixtures tests.yml's own `image` job generates.
  #
  # SAME REASONING AS release-gate ABOVE: release.yml fires only on a tag
  # push or workflow_dispatch, this project has no tag, and
  # boot-published-image is itself guarded to the tag-push trigger, so no
  # run available here ever executes it. A comment describing what that job
  # does is a claim nothing checks (decision/0113) -- so this asserts the
  # wiring statically instead: that a container-smoke.mjs step exists, that
  # its CONTAINER_NAME/BASE_URL agree with the container release.yml's own
  # `docker run` step actually boots (not a name this script invented), and
  # that every SMOKE_* variable container-smoke.mjs requires with no default
  # is one release.yml's job actually supplies. That last check is what
  # makes the duplicated fixtures safe to leave duplicated: add an eighth
  # required variable to container-smoke.mjs and this goes red on the same
  # PR, rather than silently on the next tag push.
  published-smoke-gate:
    timeout-minutes: 5
    name: published image boot runs the full container smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned the same way release-gate above pins it, for the same reason:
      # a runner image change should not turn this into a mysterious
      # ImportError that reads like a real regression.
      - name: Install PyYAML
        run: python3 -m pip install --quiet 'PyYAML==6.0.2'

      - name: boot-published-image runs container-smoke.mjs against the container it boots
        run: python3 .github/scripts/assert-published-smoke.py

      # Same purpose as release-gate's own "Show what was parsed" step: the
      # assertion above can only fail on a real regression while it is
      # reading files whose shape it understands, and this re-runs it with
      # that understanding printed, so a reader sees what was parsed rather
      # than only a verdict.
      - name: Show what was parsed
        run: python3 .github/scripts/assert-published-smoke.py --verbose

  # item/changelog-release-notes (issue #31): exercises
  # .github/scripts/changelog-section.sh directly against the committed
  # CHANGELOG.md, on every PR, so a change to either one that breaks the
  # extractor is caught here rather than on the next real tag push -- which
  # is the one place release.yml runs where nobody is watching for it.
  #
  # No `needs:` on purpose, same reasoning as compose-secret above: this is
  # a couple of seconds of shell against a checked-out file, unrelated to
  # anything the other jobs build.
  # item/readme-owner (issue #33), clause 1: "README contains no OWNER
  # placeholder". The placeholder was in five places, not one -- the README
  # and three pages the docs site publishes -- while release.yml has always
  # pushed to ghcr.io/${{ github.repository }} and two of its own comments
  # already spelled the ref out. So the project knew the owner and asked its
  # readers to supply it anyway.
  #
  # This job is the ratchet, because item/image-size's clause already made
  # the general argument: "a README sentence alone is documentation of an
  # intention, not a gate". Removing the placeholder once does not stop the
  # next doc page being written with it; failing the build does.
  #
  # Deliberately greps for the placeholder rather than asserting the real ref
  # is present. Asserting presence would pass a page that names the ref in a
  # sentence and still tells the reader to substitute something in the
  # command, which is the state this fixes. Absence of the placeholder is the
  # property that actually matters.
  #
  # This file is excluded from its own pathspec, and that exclusion is load-
  # bearing rather than tidiness: the search string and the error message
  # below both contain the literal placeholder, so without it this job
  # matches itself and fails on every run forever -- red for a reason that
  # has nothing to do with the docs. Caught locally by running the grep
  # before pushing. The cost of the exclusion is stated plainly: a
  # placeholder introduced INSIDE tests.yml is the one place this cannot
  # see.
  #
  # No `needs:` on purpose, same reasoning as the two jobs below: a grep over
  # checked-out files, unrelated to anything the other jobs build.
  docs-name-the-real-image:
    timeout-minutes: 5
    name: docs name the real image, not a placeholder
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No OWNER placeholder in any tracked file
        run: |
          set +e
          hits="$(git grep -n -F 'ghcr.io/OWNER' -- '*.md' '*.yml' '*.yaml' ':(exclude).github/workflows/tests.yml' 2>/dev/null)"
          set -e

          if [ -n "$hits" ]; then
            echo "::error::a 'ghcr.io/OWNER' placeholder is back. The image ref is ghcr.io/turbophp/doccum -- release.yml publishes to ghcr.io/\${{ github.repository }}, so the owner is never something a reader has to supply. See item/readme-owner clause 1."
            echo "$hits"
            exit 1
          fi

          echo "no ghcr.io/OWNER placeholder in any tracked .md or workflow file"

      # The check above can only fail on a real regression if it is looking at
      # files that exist and can match. A grep that silently searches nothing
      # -- wrong pathspec, renamed directory -- passes forever and proves
      # nothing, which is this repository's recurring failure mode. So assert
      # the corpus is non-empty and contains the pages this item is about.
      - name: The grep is actually looking at the docs it claims to check
        run: |
          set -euo pipefail

          for f in README.md docs/self-hosting/quick-start.md \
                   docs/self-hosting/upgrading.md \
                   docs/self-hosting/backup-and-restore.md; do
            if [ ! -f "$f" ]; then
              echo "::error::${f} is missing, so the placeholder check above searched a corpus that no longer includes it -- the check would pass whatever that file now says"
              exit 1
            fi
          done

          # Same pathspec as the check above, so a pathspec that matches
          # nothing fails here rather than passing silently there.
          count="$(git grep -l -F 'ghcr.io/turbophp/doccum' -- '*.md' | wc -l)"
          if [ "$count" -lt 4 ]; then
            echo "::error::expected at least 4 markdown files naming ghcr.io/turbophp/doccum (README plus the three self-hosting pages), found ${count} -- either a page stopped naming the image or the pathspec stopped matching"
            git grep -l -F 'ghcr.io/turbophp/doccum' -- '*.md' || true
            exit 1
          fi

          echo "${count} markdown files name ghcr.io/turbophp/doccum"

  # item/image-size (issue #30). README.md's "Image size" table and
  # .github/image-budget.json hold the SAME three facts -- two byte counts and
  # the commit they were measured at -- and image-size.sh gates only the
  # budget file. Its own note says raising a figure "takes a Decision saying
  # why", so the supported way to raise the ceiling was also a way to leave
  # the README quoting a size this project no longer builds, silently, in the
  # file a self-hoster reads before pulling anything. decision/0125: a check
  # must synchronise on everything it asserts, not a subset.
  #
  # No `needs:` on purpose, same reasoning as docs-name-the-real-image above:
  # this reads two checked-out files and builds nothing. It deliberately does
  # NOT measure an image -- image-size.sh owns that, against a real build in
  # the `image` job -- so it stays a second-long text comparison rather than a
  # slower duplicate of a check that already exists.
  image-size-docs-agree:
    timeout-minutes: 5
    name: the README's image size agrees with the enforced budget
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: README.md and .github/image-budget.json state the same numbers
        run: python3 .github/scripts/assert-image-size-docs.py

      # Printed, not relied upon: the script REFUSES when it cannot find its
      # subject (a renamed section, a byte figure that appears zero times), so
      # this step exists to show a reader what was compared, not to be the
      # defence. decision/0113 -- a guard that reports by printing is defeated
      # by a pipe, so the refusal is in the exit code and this is commentary.
      - name: Show what was compared
        run: python3 .github/scripts/assert-image-size-docs.py --verbose

  changelog-section:
    timeout-minutes: 5
    name: changelog-section.sh extracts release notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: An existing version extracts a correct, non-empty section
        run: |
          set +e
          output="$(.github/scripts/changelog-section.sh 0.1.0 CHANGELOG.md)"
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "::error::expected 'changelog-section.sh 0.1.0' to exit 0, but it exited $status"
            echo "$output"
            exit 1
          fi

          if [ -z "$output" ]; then
            echo "::error::expected non-empty output for version 0.1.0, got nothing"
            exit 1
          fi

          # A known line from CHANGELOG.md's [0.1.0] section, so this fails
          # if the section is ever emptied or the extractor starts grabbing
          # the wrong one, not just if it exits non-zero.
          known_line='Home dashboard: recent files, storage by period, and quick search.'
          if ! printf '%s' "$output" | grep -qF "$known_line"; then
            echo "::error::expected the [0.1.0] section to contain the known line '$known_line', but it did not"
            echo "$output"
            exit 1
          fi

          echo "version 0.1.0 extracted correctly:"
          echo "$output"

      # This is the load-bearing assertion (see CLAUDE.md and the item's
      # doneWhen): an extractor that returns empty on a missing section lets
      # release.yml publish a Release with a blank body, successfully, and
      # nothing here would ever have caught it.
      - name: A version that does not exist fails non-zero, naming itself
        run: |
          set +e
          output="$(.github/scripts/changelog-section.sh 99.99.99 CHANGELOG.md 2>&1)"
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "::error::expected 'changelog-section.sh 99.99.99' to exit non-zero (no such section exists), but it exited 0 with output: $output"
            exit 1
          fi

          if ! printf '%s' "$output" | grep -qF '99.99.99'; then
            echo "::error::expected the failure message to name the missing version '99.99.99', but got: $output"
            exit 1
          fi

          echo "missing version 99.99.99 correctly failed (exit $status), message names it:"
          echo "$output"

      # item/release-v0-1-0 (issue #32): the rc tag that item needs would
      # otherwise fail HERE, after the image had already been pushed --
      # publishing a container and creating no Release. Asserting the BODY
      # rather than only the exit code, because a fallback that resolved to
      # the wrong section, or to an empty one, would exit 0 just as happily.
      - name: A pre-release version falls back to its release section
        run: |
          set +e
          output="$(.github/scripts/changelog-section.sh v0.1.0-rc1 CHANGELOG.md)"
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "::error::expected 'changelog-section.sh v0.1.0-rc1' to exit 0 by falling back to [0.1.0], but it exited $status"
            echo "$output"
            exit 1
          fi

          expected="$(.github/scripts/changelog-section.sh 0.1.0 CHANGELOG.md)"
          if [ "$output" != "$expected" ]; then
            echo "::error::expected v0.1.0-rc1 to yield exactly the [0.1.0] section, but the two differ"
            echo "--- rc1 ---"; echo "$output"
            echo "--- 0.1.0 ---"; echo "$expected"
            exit 1
          fi

          echo "v0.1.0-rc1 fell back to [0.1.0] and produced that section verbatim"

      # The fallback must not become a way for a missing section to pass.
      # Without this, widening the extractor to accept rc tags would have
      # quietly re-opened the exact hole the assertion above closes, for
      # every tag that carries a suffix -- and the suffix case is the one
      # this repository is about to start using.
      - name: A pre-release of a version that does not exist still fails, naming both
        run: |
          set +e
          output="$(.github/scripts/changelog-section.sh v99.99.99-rc1 CHANGELOG.md 2>&1)"
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "::error::expected 'changelog-section.sh v99.99.99-rc1' to exit non-zero (neither section exists), but it exited 0 with output: $output"
            exit 1
          fi

          for named in '99.99.99-rc1' '99.99.99'; do
            if ! printf '%s' "$output" | grep -qF "$named"; then
              echo "::error::expected the failure message to name '$named', but got: $output"
              exit 1
            fi
          done

          echo "missing pre-release v99.99.99-rc1 correctly failed (exit $status), naming the tag and its release section:"
          echo "$output"

  image:
    timeout-minutes: 30
    name: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # linux/amd64 only, and no qemu: the runner already is amd64, and this
      # job never pushes the image anywhere, so a second, emulated platform
      # would only slow the smoke test down for nothing it checks.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      # No DOCCUM_VERSION build-arg on purpose: this job never builds from a
      # tag, so there is no external version to pass in. The Dockerfile's ARG
      # default (0.1.0-dev) and config/doccum.php's env() default are the
      # same literal, so the smoke's version-pill check -- pill == the
      # image's org.opencontainers.image.version label == config('doccum.version')
      # -- still compares three independently-sourced reads of that one
      # value, it just happens to be the dev default rather than a release
      # tag. See item/version-from-tag and container-smoke.mjs's checkTopbar.
      - name: Build image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: doccum:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # item/measure-image-size (issue #30), decision/0087: measures the
      # image just built and, once .github/image-budget.json holds a
      # recorded figure (it starts as the sentinel "UNMEASURED"), gates on
      # it -- so every PR both prints and enforces this, not just the
      # release build. See .github/scripts/image-size.sh for what "gates"
      # means precisely and why the two numbers are not registry pull size.
      - name: Measure and gate image size
        run: .github/scripts/image-size.sh doccum:ci

      # This is the check CLAUDE.md's Docker section is really about: image
      # build runs `composer dump-autoload`, which runs `package:discover`,
      # with no database in the image at all. A container that boots and
      # answers HTTP -- but never queries anything until a request needs it
      # -- is the only proof that guard actually held. The GHA runner has no
      # outbound proxy of its own, unlike a local dev machine, so none of the
      # network workarounds this repo needs elsewhere apply here.
      - name: Smoke test the image
        run: |
          set -e
          docker run -d --name doccum-smoke -v doccum-ci:/data -p 8080:8080 doccum:ci

          ok=false
          for i in $(seq 1 30); do
            if ! docker inspect -f '{{.State.Running}}' doccum-smoke 2>/dev/null | grep -q true; then
              echo "::error::container exited before it ever answered"
              break
            fi
            if body=$(curl -sS -L --max-time 5 http://127.0.0.1:8080/ 2>/dev/null); then
              if echo "$body" | grep -q 'Set up doccum'; then
                ok=true
                break
              fi
            fi
            sleep 2
          done

          if [ "$ok" != true ]; then
            echo "::error::doccum never served the first-run setup screen"
            docker logs doccum-smoke || true
            exit 1
          fi

          echo "container is up and serving the installer screen"

          if ! docker inspect -f '{{.State.Running}}' doccum-smoke | grep -q true; then
            echo "::error::container crashed after answering once"
            docker logs doccum-smoke || true
            exit 1
          fi

      # Everything from here drives the real product end to end, per issue #7:
      # complete the installer, upload a file, wait for extraction, find it by
      # search, replace the container, confirm persistence. That is
      # deliberately more than "the suite is green" -- CLAUDE.md's whole point
      # is that a green suite has already missed things a running container
      # would have caught (see tests/Feature/Search/EndToEndSearchTest.php).
      #
      # Driving this over HTTP means driving Livewire: /setup (the installer),
      # the files browser's upload form, and the live search box are each a
      # Livewire component, and their real submissions are JSON payloads keyed
      # to a checksum Livewire's own client JS assembles -- there is no
      # `doccum:` artisan install command and no documented HTTP API for any
      # of this (checked in app/Console/Commands and routes/*.php before
      # writing this). Reconstructing that wire protocol by hand for three
      # unrelated components would be more fragile than driving the same
      # client a real operator uses, so a real headless browser (Playwright)
      # does it instead. See .github/scripts/container-smoke.mjs for the
      # step-by-step rationale and what each step asserts.
      #
      # Playwright is installed ad hoc, into .github/scripts/node_modules,
      # and is never added to package.json or package-lock.json -- it drives
      # the smoke test, it is not a dependency of the product.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Credentials and marker text the installer, upload and search steps
      # below all agree on, keyed to this run so two runs racing on a shared
      # runner (or a re-run) never collide. GITHUB_ENV makes these ordinary
      # environment variables for every later step in this job.
      - name: Generate smoke test fixtures
        run: |
          RUN_ID="${{ github.run_id }}-${{ github.run_attempt }}"
          DIGITS="$(echo "$RUN_ID" | tr -cd '0-9')"
          {
            echo "SMOKE_INSTANCE_NAME=doccum CI smoke"
            echo "SMOKE_ADMIN_NAME=Smoke Admin"
            # Username charset is constrained (app/Concerns/ProfileValidationRules.php:
            # ^[a-z0-9._-]+$) because it names the admin's home directory.
            echo "SMOKE_ADMIN_USERNAME=smokeadmin${DIGITS}"
            echo "SMOKE_ADMIN_EMAIL=smoke+${RUN_ID}@example.test"
            # config/app.php defaults APP_ENV to "production" when unset, and
            # the image's own `docker run` sets no APP_ENV -- so this is the
            # real production rule (app/Providers/AppServiceProvider.php):
            # min 12, mixed case, letters, numbers, symbols, uncompromised().
            echo "SMOKE_ADMIN_PASSWORD=Doccum-Smoke-${RUN_ID}!Aa9"
            echo "SMOKE_FILE_NAME=smoke-${RUN_ID}.txt"
            echo "SMOKE_FILE_MARKER=smokeword${DIGITS}"
            # item/upgrade-smoke (issue #210): a second account,
            # created directly against the database by the "Seed pre-upgrade
            # rows" step below (never through the installer or /register),
            # so it needs its own credentials rather than reusing the
            # admin's. Same username charset constraint as SMOKE_ADMIN_USERNAME
            # above.
            echo "SMOKE_STALE_USER_USERNAME=stalesmoke${DIGITS}"
            echo "SMOKE_STALE_USER_EMAIL=stale-${RUN_ID}@example.test"
            echo "SMOKE_STALE_USER_PASSWORD=Doccum-Smoke-Stale-${RUN_ID}!Aa9"
            # A host that is obviously not the one curl/tinker actually
            # connect to (127.0.0.1:8080) -- if it shows up in a response
            # or a generated URL, that can only be because X-Forwarded-Host
            # was honoured, not because it was already there.
            echo "SMOKE_FORWARDED_HOST=smoke-proxy-${DIGITS}.invalid"
          } >> "$GITHUB_ENV"

      - name: Install Playwright (smoke-test driver only, not a project dependency)
        timeout-minutes: 5
        run: |
          npm install --no-save --prefix .github/scripts playwright@1.49.1
          .github/scripts/node_modules/.bin/playwright install --with-deps chromium

      - name: Complete the installer, upload a file, wait for extraction, search
        timeout-minutes: 8
        env:
          BASE_URL: http://127.0.0.1:8080
          CONTAINER_NAME: doccum-smoke
          # Generous but bounded: extraction of a plain-text upload needs no
          # OCR and should finish in well under a second once the ingest
          # worker picks it up, but this is a real queue hop through a real
          # worker (supervisor runs `queue:work --queue=ingest`), not
          # Queue::fake(), so it gets real headroom rather than a tight poll.
          EXTRACTION_TIMEOUT_MS: '60000'
          SEARCH_TIMEOUT_MS: '20000'
          # Set by "Generate smoke test fixtures" above via GITHUB_ENV; named
          # here too so it is obvious this step (specifically the forwarded
          # password-reset URL check added for item/reverse-proxy-ready)
          # depends on it.
          SMOKE_FORWARDED_HOST: ${{ env.SMOKE_FORWARDED_HOST }}
          # issue #339. The README screenshot is produced HERE, by the same
          # browser driving the same container the rest of this step asserts
          # against -- there is no second pipeline, and no hand-taken image.
          # captureReadmeScreenshot() refuses to capture a files view that is
          # missing its tree, its table or the file this step just uploaded,
          # so a broken UI fails this step rather than quietly producing a
          # screenshot of the breakage.
          SMOKE_SCREENSHOT_PATH: ${{ github.workspace }}/smoke-artifacts/readme-screenshot.png
        run: node .github/scripts/container-smoke.mjs setup

      # Uploaded on every run, including a red one: when the smoke fails
      # somewhere AFTER the capture, the image is the fastest way to see what
      # the UI actually looked like. `if: always()` rather than success().
      #
      # if-no-files-found: ignore, and this step GUARDS NOTHING -- said plainly
      # because the first version of this comment read as though it did. When
      # the smoke dies before the capture the PNG legitimately does not exist,
      # and a second red step there would be noise on an already-red job. The
      # refusal that matters lives in captureReadmeScreenshot(), which fails
      # the smoke itself if the file is missing or implausibly small.
      #
      # The committed docs/images/readme-files-view.png is refreshed FROM this
      # artifact, deliberately as a manual step. See README.md's note and the
      # PR for issue #339: a byte-comparison gate on a browser screenshot
      # reddens main for font-rendering and timing differences that say
      # nothing about the product, and this repository does not have a way to
      # go red for a non-reason without teaching itself to ignore red.
      - name: Upload the README screenshot this run produced
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readme-screenshot
          path: smoke-artifacts/readme-screenshot.png
          if-no-files-found: ignore
          retention-days: 7

      # item/reverse-proxy-ready (issue #58): TRUSTED_PROXIES and the
      # APP_URL-unset fallback (bootstrap/app.php, ForceRootUrlFromRequest)
      # only matter once something actually sits in front of this container
      # rewriting scheme and host -- so this sends the same headers a real
      # Caddy/nginx/Traefik would and checks the rendered page came out
      # https:// on the forwarded host, not http:// on 127.0.0.1:8080.
      #
      # Plain curl, no Playwright: this only needs the raw HTML doccum's own
      # server rendered, and Playwright cannot reliably set Host-class
      # headers on a top-level navigation. The container has a real user by
      # now (the previous step's installer run), so /login renders the form
      # instead of redirecting to /setup.
      - name: Verify X-Forwarded-Proto/-Host are honoured (login form + assets)
        timeout-minutes: 2
        run: |
          set -e

          body="$(curl -sS --max-time 10 \
            -H "X-Forwarded-Proto: https" \
            -H "X-Forwarded-Host: ${SMOKE_FORWARDED_HOST}" \
            http://127.0.0.1:8080/login)"

          if ! echo "$body" | grep -qF "action=\"https://${SMOKE_FORWARDED_HOST}/login\""; then
            echo "::error::login form action did not honour X-Forwarded-Proto/-Host"
            echo "--- action attributes found ---"
            echo "$body" | grep -o 'action="[^"]*"' || true
            exit 1
          fi
          echo "login form action is https on the forwarded host -- OK"

          if ! echo "$body" | grep -qE "(src|href)=\"https://${SMOKE_FORWARDED_HOST}/build/"; then
            echo "::error::no asset URL on the login page honoured X-Forwarded-Proto/-Host"
            echo "--- build/ references found ---"
            echo "$body" | grep -oE '(src|href)="[^"]*build/[^"]*"' || true
            exit 1
          fi
          echo "at least one asset URL is https on the forwarded host -- OK"

      # item/upgrade-smoke (issue #210): everything from "Smoke
      # test the image" onward has driven ONE container up from an
      # empty volume, so by this point every row in it -- the admin user,
      # the roles RolesAndPermissionsSeeder created -- was written by the
      # very code under test. Replacing that container with itself, as the
      # next step does, therefore only proves a RESTART survives; it cannot
      # catch a regression that only bites a row an older instance's history
      # produced, which is exactly how #210 happened (see
      # database/migrations/2026_09_18_150000_backfill_email_verified_at_for_existing_users.php's
      # own docblock).
      #
      # Rather than maintaining and pulling an older published image -- whose
      # schema only drifts further from HEAD with every migration this
      # repository ships -- this makes the CURRENT volume look like it
      # predates the candidate image in the two ways that have actually
      # locked a real instance out before: an unverified user
      # (email_verified_at NULL) and a role whose permissions were edited
      # away from the seeded default. Run against doccum-smoke while it is
      # STILL the setup container, one step before it is torn down, so the
      # write lands on doccum-ci, the named volume the replacement below
      # reuses. See .github/scripts/container-smoke.mjs's seedStaleRows()
      # for exactly what this writes, and why it also rolls back the
      # backfill migration's own `migrations` row rather than only inserting
      # a NULL user -- that detail is what makes the "verify" phase's later
      # assertion a genuine re-run of the migration instead of a restart
      # against a row that merely happens to be NULL (decision/0067).
      - name: Seed pre-upgrade rows before replacing the container
        timeout-minutes: 2
        env:
          CONTAINER_NAME: doccum-smoke
        run: node .github/scripts/container-smoke.mjs seed-stale

      # `storage/` does not survive this and is not meant to: the SAME image
      # and the SAME named volume are reused, so /data is the only thing that
      # is supposed to come back, which is exactly what the next step checks.
      #
      # Replaced, not restarted. `docker restart` keeps the container's
      # writable layer, so a database inside the image layer survives it and
      # this step passes while proving nothing about the volume. Destroying
      # the container and starting a new one from the same image against the
      # same named volume is what "persists" has to mean for a container
      # people are told to upgrade by replacing. See issue #91.
      - name: Replace the container, keeping only the volume
        timeout-minutes: 3
        run: |
          set -e
          docker rm -f doccum-smoke
          docker run -d --name doccum-smoke -v doccum-ci:/data -p 8080:8080 doccum:ci

          ok=false
          for i in $(seq 1 30); do
            if ! docker inspect -f '{{.State.Running}}' doccum-smoke 2>/dev/null | grep -q true; then
              echo "::error::the replacement container exited"
              break
            fi
            if curl -sS -L --max-time 5 http://127.0.0.1:8080/ >/dev/null 2>&1; then
              ok=true
              break
            fi
            sleep 2
          done

          if [ "$ok" != true ]; then
            echo "::error::doccum never came up from the fresh container"
            docker logs doccum-smoke || true
            exit 1
          fi

          echo "a fresh container on the same volume is up"

      - name: Verify persistence across a container replacement
        timeout-minutes: 5
        env:
          BASE_URL: http://127.0.0.1:8080
          CONTAINER_NAME: doccum-smoke
          SEARCH_TIMEOUT_MS: '20000'
        run: node .github/scripts/container-smoke.mjs verify

      - name: Container logs
        if: failure()
        run: |
          docker logs doccum-smoke || true
          echo "--- docker ps -a ---"
          docker ps -a || true
          echo "--- supervisorctl status ---"
          docker exec doccum-smoke supervisorctl -c /etc/supervisor/conf.d/doccum.conf status || true
