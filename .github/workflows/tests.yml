name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A push that supersedes an in-flight run (force-push, quick follow-up commit)
# should not keep burning runner minutes on code nobody will look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Kept in one place so bumping the default PHP version touches one line.
  PRIMARY_PHP: '8.4'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.PRIMARY_PHP }}
          tools: composer:v2
          coverage: none

      - name: Cache composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor
          key: composer-${{ env.PRIMARY_PHP }}-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Pint (format check)
        run: composer lint:check

      # ~44 pre-existing findings today at level 7 (see CLAUDE.md) -- the
      # point of this job is to stop that number growing, not to demand it
      # hits zero in one PR. A real `phpstan-baseline.neon`, wired into
      # phpstan.neon's `includes`, is the clean way to do that, but generating
      # one needs `vendor/`, which this sandbox does not have installed, so it
      # could not be produced here. Until a maintainer runs
      # `composer types:check -- --generate-baseline` locally once and commits
      # the result, this counts findings instead and fails only on an
      # INCREASE -- strictly worse than a real baseline (a finding can move
      # without the count changing) but still catches the common case, and
      # never blocks on the pre-existing 44. Delete the counting step below
      # the day the baseline file lands and go back to a plain
      # `composer types:check`.
      - name: PHPStan (fails only on new findings)
        env:
          PHPSTAN_BASELINE_COUNT: 44
        run: |
          composer types:check -- --error-format=json --no-progress > phpstan-result.json || true
          COUNT=$(php -r '
            $data = json_decode(file_get_contents("phpstan-result.json"), true);
            echo (int) ($data["totals"]["file_errors"] ?? 0);
          ')
          echo "phpstan findings: ${COUNT} (baseline: ${PHPSTAN_BASELINE_COUNT})"

          # A count on its own tells whoever reads this that they broke
          # something and nothing about what, which is the difference between
          # a failure they can act on and one they have to reproduce locally
          # first -- and reproducing it locally is exactly what the
          # environment this project is developed in cannot do.
          php -r '
            $data = json_decode(file_get_contents("phpstan-result.json"), true);
            foreach (($data["files"] ?? []) as $file => $entry) {
              foreach (($entry["messages"] ?? []) as $message) {
                printf("%s:%s  %s%s", $file, $message["line"] ?? "?", $message["message"] ?? "", PHP_EOL);
              }
            }
          '

          if [ "$COUNT" -gt "$PHPSTAN_BASELINE_COUNT" ]; then
            echo "::error::phpstan findings went from ${PHPSTAN_BASELINE_COUNT} to ${COUNT}. Fix the new ones listed above. Never raise PHPSTAN_BASELINE_COUNT to make this pass."
            exit 1
          fi

  # Built once and shared with every test leg below -- the compiled assets
  # depend on package-lock.json, not on the PHP version or database under
  # test, so building them six times would just be six copies of the same
  # `public/build` output.
  assets:
    name: build assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.PRIMARY_PHP }}
          tools: composer:v2
          coverage: none

      - name: Cache composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor
          key: composer-${{ env.PRIMARY_PHP }}-${{ hashFiles('composer.lock') }}

      # resources/css/app.css imports Flux's stylesheet straight out of
      # vendor/, so the PHP dependencies have to be on disk before Vite can
      # resolve anything. This is why the old single-job CI ran `composer
      # setup`, which did both in order.
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-build
          path: public/build
          retention-days: 1

  test:
    name: test (php ${{ matrix.php }}, ${{ matrix.database }})
    needs: assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        database: [sqlite, pgsql, mysql]
        include:
          # sqlite is the product's own default (spec: embedded, no server),
          # and the only driver FTS5 keyword search runs on -- everything
          # else falls back to LIKE (Search\SearchIndex), so both code paths
          # genuinely need their own leg, not just a config knob.
          - database: sqlite
            db_connection: sqlite
            db_database: ':memory:'
          - database: pgsql
            db_connection: pgsql
            db_host: 127.0.0.1
            db_port: 5432
            db_database: doccum
            db_username: doccum
            db_password: doccum
          - database: mysql
            db_connection: mysql
            db_host: 127.0.0.1
            db_port: 3306
            db_database: doccum
            db_username: doccum
            db_password: doccum
    # Both services always start, even on the sqlite legs that never touch
    # them: GitHub Actions has no way to make a job's service containers
    # conditional on the matrix leg that will end up running, only on the
    # job as a whole. The alternative -- three separate jobs -- would dodge
    # the idle containers but split the "one test job, one matrix" shape the
    # task asks for, so the few wasted seconds of container start-up on
    # sqlite legs are accepted here instead.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: doccum
          POSTGRES_USER: doccum
          POSTGRES_PASSWORD: doccum
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U doccum"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: doccum
          MYSQL_USER: doccum
          MYSQL_PASSWORD: doccum
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    # Real environment variables, not phpunit.xml edits: RefreshDatabase
    # resolves config('database.default') lazily at rollback time, and
    # phpunit.xml's <env> entries do not use force="true", so a genuine OS
    # env var here wins over the file's sqlite default -- exactly the seam
    # CLAUDE.md calls out.
    env:
      DB_CONNECTION: ${{ matrix.db_connection }}
      DB_HOST: ${{ matrix.db_host }}
      DB_PORT: ${{ matrix.db_port }}
      DB_DATABASE: ${{ matrix.db_database }}
      DB_USERNAME: ${{ matrix.db_username }}
      DB_PASSWORD: ${{ matrix.db_password }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
          # Matches the Dockerfile's install-php-extensions list (pdo_sqlite
          # pdo_pgsql pdo_mysql intl gd zip bcmath exif) so CI exercises the
          # same driver set the shipped image does, both database directions
          # included.
          extensions: mbstring, pdo_sqlite, pdo_pgsql, pdo_mysql, sqlite3, intl, gd, zip, bcmath, exif, fileinfo

      - name: Cache composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      # Only APP_KEY is needed from here -- no `artisan migrate` call, because
      # tests/Pest.php applies RefreshDatabase suite-wide, and that migrates
      # (against the real DB_* env vars set above) itself, once per test.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Download build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: public-build
          path: public/build

      # No separate "wait for it" step is needed here: GitHub Actions already
      # blocks every step in this job until the service containers' own
      # --health-cmd checks pass, sqlite legs included (they just have no
      # service to wait on).
      - name: Run tests
        run: php artisan test

  image:
    name: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # linux/amd64 only, and no qemu: the runner already is amd64, and this
      # job never pushes the image anywhere, so a second, emulated platform
      # would only slow the smoke test down for nothing it checks.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Build image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: doccum:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # This is the check CLAUDE.md's Docker section is really about: image
      # build runs `composer dump-autoload`, which runs `package:discover`,
      # with no database in the image at all. A container that boots and
      # answers HTTP -- but never queries anything until a request needs it
      # -- is the only proof that guard actually held. The GHA runner has no
      # outbound proxy of its own, unlike a local dev machine, so none of the
      # network workarounds this repo needs elsewhere apply here.
      - name: Smoke test the image
        run: |
          set -e
          docker run -d --name doccum-smoke -v doccum-ci:/data -p 8080:8080 doccum:ci

          ok=false
          for i in $(seq 1 30); do
            if ! docker inspect -f '{{.State.Running}}' doccum-smoke 2>/dev/null | grep -q true; then
              echo "::error::container exited before it ever answered"
              break
            fi
            if body=$(curl -sS -L --max-time 5 http://127.0.0.1:8080/ 2>/dev/null); then
              if echo "$body" | grep -q 'Set up doccum'; then
                ok=true
                break
              fi
            fi
            sleep 2
          done

          if [ "$ok" != true ]; then
            echo "::error::doccum never served the first-run setup screen"
            docker logs doccum-smoke || true
            exit 1
          fi

          echo "container is up and serving the installer screen"

          if ! docker inspect -f '{{.State.Running}}' doccum-smoke | grep -q true; then
            echo "::error::container crashed after answering once"
            docker logs doccum-smoke || true
            exit 1
          fi

      - name: Container logs
        if: failure()
        run: docker logs doccum-smoke || true
