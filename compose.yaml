name: doccum

x-app: &app
  build:
    context: .
    args:
      WITH_OFFICE: "false"
  environment: &app-env
    APP_ENV: production
    APP_DEBUG: "false"
    APP_URL: http://localhost:8080
    DB_CONNECTION: sqlite
    DB_DATABASE: /data/doccum.sqlite
    # Queue, cache and sessions on database/file drivers: the default stack
    # needs no Redis container at all.
    QUEUE_CONNECTION: database
    CACHE_STORE: database
    SESSION_DRIVER: database
    FILESYSTEM_DISK: documents
    AWS_ACCESS_KEY_ID: doccum
    # No known default -- a known secret in a public repo is a known secret in
    # every install that copies it. `:-` here and NOT `:?`, because the default
    # stack never reads this value: `app` runs with DOCCUM_EMBEDDED_STORAGE=true,
    # so 48-doccum-storage.sh generates a random password into /data/minio.env,
    # and RuntimeConfigServiceProvider::applyEmbeddedStorage() overwrites
    # documents.key/secret/endpoint from that file at boot -- for all four
    # services, since they share the db:/data volume. The refusal belongs to the
    # `storage` profile's own minio service below, which is the only place this
    # password actually sets anything, and that is where the `:?` lives.
    #
    # Be aware, before moving either marker: compose interpolates the WHOLE file
    # regardless of which profiles are selected (verified on Compose v5.1.1 --
    # even `--profile nonexistent` fails), so the `:?` below makes
    # MINIO_ROOT_PASSWORD required for EVERY compose invocation, this stack
    # included. That is deliberate and is the cost of a refusal CI can prove
    # without booting anything; the README says so. It is not a per-profile
    # requirement, because compose has no way to express one.
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
    AWS_DEFAULT_REGION: us-east-1
    AWS_BUCKET: doccum
  volumes:
    # Mounted at /data, NOT at /var/www/html/database -- a volume there would
    # shadow database/migrations and every migration would silently vanish.
    - db:/data
  restart: unless-stopped

services:
  # Only this service runs the boot automation, so four containers never race
  # to migrate the same SQLite file.
  app:
    <<: *app
    environment:
      <<: *app-env
      AUTORUN_ENABLED: "true"
      # This is the only container that runs MinIO -- see docker/supervisor/doccum.conf.
      # It reaches its own MinIO at the config default (127.0.0.1:9000), so no
      # AWS_ENDPOINT override is needed here.
      DOCCUM_EMBEDDED_STORAGE: "true"
    ports:
      - "8080:8080"

  worker:
    <<: *app
    environment:
      <<: *app-env
      AUTORUN_ENABLED: "false"
      # Workers share this image but must never start their own MinIO against
      # the same data directory -- they reach the app container's instead.
      DOCCUM_EMBEDDED_STORAGE: "false"
      AWS_ENDPOINT: http://app:9000
    command: ["php", "artisan", "queue:work", "--queue=default", "--tries=3", "--max-time=3600"]
    # The base image's healthcheck curls HTTP, which a worker never serves, so
    # it would report unhealthy forever. Check the worker process instead.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work --queue=default' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker-ingest:
    <<: *app
    environment:
      <<: *app-env
      AUTORUN_ENABLED: "false"
      DOCCUM_EMBEDDED_STORAGE: "false"
      AWS_ENDPOINT: http://app:9000
    command: ["php", "artisan", "queue:work", "--queue=ingest", "--tries=2", "--timeout=900", "--max-time=3600"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work --queue=ingest' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scheduler:
    <<: *app
    environment:
      <<: *app-env
      AUTORUN_ENABLED: "false"
      DOCCUM_EMBEDDED_STORAGE: "false"
      AWS_ENDPOINT: http://app:9000
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Opt-in, standalone MinIO for anyone who wants storage outside the app
  # container (e.g. pointing multiple installs at one bucket). The default
  # stack does not start these -- embedded storage runs inside `app` instead.
  minio:
    image: quay.io/minio/minio:latest
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: doccum
      # Required, not defaulted: this profile is the only place a known
      # password would otherwise ship in a public repo, so compose refuses
      # to resolve at all until an operator supplies one.
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD to the password this MinIO should use -- there is no default on purpose, since this profile stores objects outside the app container and a known password here would be a known password for anyone who runs the storage profile.}"
    volumes:
      - minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

  # Retries until MinIO answers, so it needs no ordering constraint either.
  minio-init:
    image: quay.io/minio/mc:latest
    profiles: ["storage"]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 doccum ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD to the same password given to the minio service above.}; do sleep 1; done;
      mc mb --ignore-existing local/doccum;
      exit 0;
      "
    restart: "no"

  postgres:
    image: postgres:17-alpine
    profiles: ["db"]
    environment:
      POSTGRES_DB: doccum
      POSTGRES_USER: doccum
      POSTGRES_PASSWORD: doccum
    volumes:
      - pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    volumes:
      - redis:/data

volumes:
  db:
  minio:
  pg:
  redis:
