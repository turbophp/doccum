name: doccum

x-app: &app
  build:
    context: .
    args:
      WITH_OFFICE: "false"
  environment: &app-env
    APP_ENV: production
    APP_DEBUG: "false"
    APP_URL: http://localhost:8080
    DB_CONNECTION: sqlite
    DB_DATABASE: /data/doccum.sqlite
    # Queue, cache and sessions on database/file drivers: the default stack
    # needs no Redis container at all.
    QUEUE_CONNECTION: database
    CACHE_STORE: database
    SESSION_DRIVER: database
    FILESYSTEM_DISK: documents
    AWS_ACCESS_KEY_ID: doccum
    # No known default -- a known secret in a public repo is a known secret in
    # every install that copies it. `:-` here and NOT `:?`, because the default
    # stack never reads this value: `app` runs with DOCCUM_EMBEDDED_STORAGE=true,
    # so 48-doccum-storage.sh generates a random password into /data/storage.env,
    # and RuntimeConfigServiceProvider::applyEmbeddedStorage() overwrites
    # documents.key/secret/endpoint from that file at boot -- for all four
    # services, since they share the db:/data volume. The refusal belongs to the
    # `storage` profile's own storage service below, which is the only place this
    # password actually sets anything, and that is where the `:?` lives.
    #
    # Be aware, before moving either marker: compose interpolates the WHOLE file
    # regardless of which profiles are selected (verified on Compose v5.1.1 --
    # even `--profile nonexistent` fails), so the `:?` below makes
    # MINIO_ROOT_PASSWORD required for EVERY compose invocation, this stack
    # included. That is deliberate and is the cost of a refusal CI can prove
    # without booting anything; the README says so. It is not a per-profile
    # requirement, because compose has no way to express one.
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
    AWS_DEFAULT_REGION: us-east-1
    AWS_BUCKET: doccum
  volumes:
    # Mounted at /data, NOT at /var/www/html/database -- a volume there would
    # shadow database/migrations and every migration would silently vanish.
    - db:/data
  restart: unless-stopped

services:
  # Only this service runs the boot automation, so four containers never race
  # to migrate the same SQLite file.
  app:
    <<: *app
    environment:
      <<: *app-env
      AUTORUN_ENABLED: "true"
      # This is the only container that runs the embedded object store -- see
      # docker/supervisor/doccum.conf. It reaches its own store at the config
      # default (127.0.0.1:9000), so no AWS_ENDPOINT override is needed here.
      DOCCUM_EMBEDDED_STORAGE: "true"
    ports:
      - "8080:8080"

  worker:
    <<: *app
    environment:
      <<: *app-env
      AUTORUN_ENABLED: "false"
      # Workers share this image but must never start their own object store
      # against the same data directory -- they reach the app container's instead.
      DOCCUM_EMBEDDED_STORAGE: "false"
      AWS_ENDPOINT: http://app:9000
    command: ["php", "artisan", "queue:work", "--queue=default", "--tries=3", "--max-time=3600"]
    # The base image's healthcheck curls HTTP, which a worker never serves, so
    # it would report unhealthy forever. Check the worker process instead.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work --queue=default' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker-ingest:
    <<: *app
    environment:
      <<: *app-env
      AUTORUN_ENABLED: "false"
      DOCCUM_EMBEDDED_STORAGE: "false"
      AWS_ENDPOINT: http://app:9000
    command: ["php", "artisan", "queue:work", "--queue=ingest", "--tries=2", "--timeout=900", "--max-time=3600"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work --queue=ingest' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scheduler:
    <<: *app
    environment:
      <<: *app-env
      AUTORUN_ENABLED: "false"
      DOCCUM_EMBEDDED_STORAGE: "false"
      AWS_ENDPOINT: http://app:9000
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Opt-in, standalone object storage for anyone who wants it outside the app
  # container (e.g. pointing multiple installs at one bucket). The default
  # stack does not start this -- embedded storage runs inside `app` instead.
  #
  # Same server the image embeds (see the Dockerfile's `objects` stage), so an
  # operator who outgrows the embedded store is not also changing object store.
  # Pinned by digest for the reason decision/0151 records: a tag can be
  # withdrawn, and this profile is the one place compose pulls a store itself.
  #
  # The variable is still named MINIO_ROOT_PASSWORD. That name is load-bearing
  # today -- tests.yml's `compose requires MINIO_ROOT_PASSWORD` job, its
  # recorded mutation, and item/compose-secret all name it -- and renaming it
  # is a docs-and-guard change that does not belong in the swap that unblocks
  # the build. Renaming it is filed as follow-up.
  storage:
    image: ghcr.io/versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    profiles: ["storage"]
    entrypoint: ["/usr/local/bin/versitygw"]
    command: ["--port", ":9000", "--region", "us-east-1", "--iam-dir", "/iam", "posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: doccum
      # Required, not defaulted: this profile is the only place a known
      # password would otherwise ship in a public repo, so compose refuses
      # to resolve at all until an operator supplies one.
      ROOT_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD to the password this object store should use -- there is no default on purpose, since this profile stores objects outside the app container and a known password here would be a known password for anyone who runs the storage profile.}"
    volumes:
      - objects:/data
      - objects-iam:/iam
    ports:
      - "9000:9000"
    restart: unless-stopped

  # No bucket-init service: DocumentStorage::ensureBucket() creates the bucket
  # through the AWS SDK the app already carries, which is the same reason the
  # image ships no admin CLI (see the Dockerfile's storage COPY block).

  postgres:
    image: postgres:17-alpine
    profiles: ["db"]
    environment:
      POSTGRES_DB: doccum
      POSTGRES_USER: doccum
      POSTGRES_PASSWORD: doccum
    volumes:
      - pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    volumes:
      - redis:/data

volumes:
  db:
  objects:
  objects-iam:
  pg:
  redis:
