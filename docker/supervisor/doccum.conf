[supervisord]
nodaemon=true
user=www-data
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; The plan's Step 4 template omitted these three sections, which left
; `supervisorctl` unable to reach the running supervisord over its RPC
; socket ("Error: .ini file does not include supervisorctl section"),
; discovered while running Step 8's verification. Added because Step 8
; explicitly checks `supervisorctl status`; it is pure connectivity
; plumbing and does not change what runs or when.
[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:frankenphp]
command=frankenphp run --config /etc/frankenphp/Caddyfile --adapter caddyfile
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=10

[program:minio]
command=/usr/local/bin/doccum-minio
; Only the app container runs storage. The workers share this image and must
; not each start their own MinIO against the same data directory.
autostart=%(ENV_DOCCUM_EMBEDDED_STORAGE)s
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=5
